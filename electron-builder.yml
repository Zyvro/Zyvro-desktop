appId: ro.zyv.studio
productName: Zyvro Studio
copyright: Zyvro

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - package.json
  - "!**/*.map"
  # buildResources are inputs to the packager, not files it copies. The window
  # and taskbar icon is looked up at runtime, so it has to be shipped too.
  - resources/icon.png
  # Les icônes de fichiers viennent de Material Icon Theme, sous licence MIT,
  # qui demande que sa notice voyage avec toute copie : elle est dans l'app.
  - THIRD-PARTY-NOTICES.md

  # Everything the renderer uses is already bundled into out/ by Vite, so the
  # packages themselves are dead weight: monaco-editor alone is 98 MB of source
  # that never gets loaded. node-pty is the exception, because the main process
  # requires it at runtime rather than bundling it.
  - "!node_modules/**/*"
  - "node_modules/node-pty/**/*"
  - "!node_modules/node-pty/{src,deps,scripts,.github,typings}/**/*"
  - "!node_modules/node-pty/build/**/*.{o,a,d,mk,gypi,Makefile}"
  - "!node_modules/node-pty/build/Release/{obj,obj.target,.deps}/**/*"

afterPack: scripts/adhoc-sign.cjs

asar: true
# node-pty is a native module; packing it into the asar would leave its .node
# binary unloadable.
asarUnpack:
  - "**/node_modules/node-pty/**"

mac:
  icon: resources/icon.icns
  # The engine ships beside the app rather than inside the asar: it is a native
  # binary that has to be executable on disk. It is named per architecture
  # because an Intel installer carrying an arm64 engine opens a window that can
  # do nothing, and the failure would arrive on a user's machine, not here.
  extraResources:
    - from: ../Zyvro-engine/bin/zyvrod-darwin-${arch}
      to: bin/zyvrod
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  # Not signed for distribution, and that is a fact about this build rather
  # than a preference. The only certificate available is an Apple Development
  # one, which signs for the machines on a provisioning profile and satisfies
  # Gatekeeper nowhere else; using it would add a step and change nothing.
  # Distribution needs a Developer ID Application certificate and notarization.
  #
  # null makes electron-builder ad-hoc sign instead, which is the minimum an
  # Apple Silicon Mac needs to run a binary at all. RELEASE.md says what the
  # person who downloads it will see.
  identity: null
  # identity: null skips signing, and what that leaves on arm64 does not run.
  # scripts/adhoc-sign.cjs signs it properly afterwards; see the comment there.
  # The hardened runtime exists to be paired with notarization. Without it the
  # entitlements buy nothing and only constrain the child processes this app
  # is built to spawn.
  hardenedRuntime: false

win:
  icon: resources/icon.ico
  extraResources:
    - from: ../Zyvro-engine/bin/zyvrod-windows-${arch}.exe
      to: bin/zyvrod.exe
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  icon: resources/icon.png
  extraResources:
    - from: ../Zyvro-engine/bin/zyvrod-linux-${arch}
      to: bin/zyvrod
  target: [AppImage]
  category: Development
